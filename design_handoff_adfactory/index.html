<script>
  // remove boot splash once React has painted
  (function () {
    let tries = 0;
    const tick = setInterval(function () {
      const root = document.getElementById('root');
      if ((root && root.childElementCount > 0) || tries++ > 60) {
        const b = document.getElementById('boot');
        if (b) b.classList.add('gone');
        clearInterval(tick);
        setTimeout(function () { const b2 = document.getElementById('boot'); if (b2) b2.remove(); }, 350);
      }
    }, 100);
  })();
</script>
